<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            background:#f4f7fb;
            color:#21272a;
        }

        header{
            position:sticky;
            top:0;
            background:#fff;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
            border-bottom:1px solid #dde1e6;
        }

        .container{
            width:92%;
            max-width:1400px;
            margin:auto;
            height:80px;
            display:flex;
            align-items:center;
            gap:25px;
        }

        .logo a{
            display:flex;
            align-items:center;
            justify-content:center;
            width:140px;
            height:50px;
            border-radius:12px;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            color:#fff;
            text-decoration:none;
            font-size:22px;
            font-weight:bold;
        }

        .search-box{
            flex:1;
        }

        .search-box input{
            width:100%;
            height:46px;
            border:1px solid #d6d6d6;
            border-radius:30px;
            padding:0 18px;
            outline:none;
            font-size:15px;
        }

        .search-box input:focus{
            border-color:#0f62fe;
            box-shadow:0 0 0 4px rgba(15,98,254,.12);
        }

        nav{
            margin-left:auto;
        }

        nav ul{
            display:flex;
            gap:22px;
            list-style:none;
            align-items:center;
        }

        nav a{
            text-decoration:none;
            color:#333;
            font-weight:600;
        }

        nav a:hover{
            color:#0f62fe;
        }

        nav li:last-child a{
            padding:11px 20px;
            border-radius:30px;
            color:#fff;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
        }

        main{
            width:92%;
            max-width:1400px;
            margin:40px auto;
        }

        .page-title{
            text-align:center;
            margin-bottom:35px;
        }

        .page-title h2{
            font-size:34px;
            margin-bottom:10px;
        }

        .page-title p{
            color:#666;
        }

        .users-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:25px;
        }

        .user-card{
            background:#fff;
            border-radius:16px;
            padding:25px;
            box-shadow:0 15px 35px rgba(0,0,0,.07);
            transition:.3s;
        }

        .user-card:hover{
            transform:translateY(-6px);
        }

        .avatar{
            width:70px;
            height:70px;
            border-radius:50%;
            margin:auto;
            margin-bottom:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            color:#fff;
            font-size:28px;
            font-weight:bold;
        }

        .user-card h3{
            text-align:center;
            margin-bottom:18px;
        }

        .info{
            margin-bottom:12px;
            color:#555;
            font-size:15px;
        }

        .info strong{
            color:#222;
        }

        .pagination{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-top:45px;
        }

        .pagination button{
            width:45px;
            height:45px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            color:#fff;
            font-weight:bold;
            background:linear-gradient(135deg,#0f62fe,#0043ce);
            transition:.3s;
        }

        .pagination button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(15,98,254,.25);
        }

        footer{
            background:#161616;
            color:#fff;
            margin-top:60px;
        }

        footer::before{
            content:"";
            display:block;
            height:4px;
            background:linear-gradient(90deg,#0f62fe,#4589ff,#0f62fe);
        }

        .footer-container{
            width:92%;
            max-width:1400px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:30px;
            padding:50px 0;
        }

        .footer-column h3{
            margin-bottom:18px;
        }

        .footer-column a{
            display:block;
            color:#c6c6c6;
            text-decoration:none;
            margin-bottom:12px;
        }

        .footer-column a:hover{
            color:#78a9ff;
        }

        .footer-bottom{
            text-align:center;
            padding:20px;
            border-top:1px solid rgba(255,255,254,.1);
            color:#bdbdbd;
        }

        @media(max-width:900px){

            .container{
                flex-wrap:wrap;
                height:auto;
                padding:20px 0;
            }

            .search-box{
                width:100%;
                order:3;
            }

            nav{
                width:100%;
            }

            nav ul{
                justify-content:center;
                flex-wrap:wrap;
            }

            .footer-container{
                flex-direction:column;
            }

        }

    </style>

</head>
<body>

<header>

    <div class="container">

        <div class="logo">
            <a href="#">LOGO</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search users...">
        </div>

        <nav>

            <ul>

                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="login.html">Login</a></li>

            </ul>

        </nav>

    </div>

</header>

<main>

    <div class="page-title">

        <h2>All Registered Users</h2>

        <p>Manage and explore all registered users with server-side pagination.</p>

    </div>

    <!--
    DYNAMIC PAGINATED USER GRID (Day 22)
    - `#usersContainer` is dynamically populated by `users.js` with user cards fetched from `/api/users?page=X&limit=Y`.
    -->
    <div id="usersContainer" class="users-grid">
        <!-- Initial skeleton / server-rendered cards populate here -->
    </div>

    <!--
    PAGINATION CONTROLS
    - `prevBtn`: Moves back 1 page (disabled on page 1).
    - `pageNumber`: Displays active page index.
    - `nextBtn`: Advances 1 page forward (disabled on last page).
    -->
    <div class="pagination">

        <button id="prevBtn">
            ←
        </button>

        <button id="pageNumber">
            1
        </button>

        <button id="nextBtn">
            →
        </button>

    </div>

</main>

<footer>

    <div class="footer-container">

        <div class="footer-column">

            <h3>Company</h3>

            <a href="#">About</a>

            <a href="#">Contact</a>

            <a href="#">Careers</a>

        </div>

        <div class="footer-column">

            <h3>Support</h3>

            <a href="#">Help Center</a>

            <a href="#">Privacy Policy</a>

            <a href="#">Terms</a>

        </div>

        <div class="footer-column">

            <h3>Quick Links</h3>

            <a href="#">Products</a>

            <a href="users.html">Users</a>

            <a href="#">Cart</a>

        </div>

    </div>

    <div class="footer-bottom">

        © 2026 Your Company. All Rights Reserved.

    </div>

</footer>

</body>
<!-- Include `users.js` script to handle pagination and API requests -->
<script src="users.js"></script>
</html>
